      - generic [ref=e407]: Private-pay services
      - heading "Private-pay nursing visits to set up your MedPlanner" [level=1] [ref=e408]
      - paragraph [ref=e409]: We now offer affordable private-pay visits for patients and families who need a nurse to organize, set up, and explain a weekly medication planner in the comfort of home.
    - article [ref=e410]:
      - generic [ref=e411]:
        - generic [ref=e412]:
          - generic [ref=e413]:
            - heading "What is a MedPlanner visit?" [level=2] [ref=e414]
            - paragraph [ref=e415]: A MedPlanner is a simple, weekly medication organizer that helps patients and caregivers keep track of multiple prescriptions, doses, and timing. Our private-pay nursing visit brings a licensed nurse to your home to review your medications, fill the planner for the week, label everything clearly, and teach you or your caregiver how to use it safely.
            - paragraph [ref=e416]: This service is ideal for anyone who wants extra confidence with their medication routine but does not qualify for a full home health episode under insurance.
          - generic [ref=e417]:
            - heading "What is included" [level=2] [ref=e418]
            - list [ref=e419]:
              - listitem [ref=e420]:
                - generic [ref=e421]: ✓
                - text: In-home visit from a licensed nurse
              - listitem [ref=e422]:
                - generic [ref=e423]: ✓
                - text: Review of current medications, allergies, and physician instructions
              - listitem [ref=e424]:
                - generic [ref=e425]: ✓
                - text: Set up of a weekly medication planner
              - listitem [ref=e426]:
                - generic [ref=e427]: ✓
                - text: Clear labeling and written instructions
              - listitem [ref=e428]:
                - generic [ref=e429]: ✓
                - text: Education for the patient and family caregiver
              - listitem [ref=e430]:
                - generic [ref=e431]: ✓
                - text: Coordination with your pharmacy or physician when needed
          - generic [ref=e432]:
            - heading "Who benefits most" [level=2] [ref=e433]
            - paragraph [ref=e434]: This service is especially helpful for seniors managing several prescriptions, patients recently discharged from a hospital or facility, family caregivers who want peace of mind, and anyone recovering from an illness or surgery who needs temporary support getting organized.
          - generic [ref=e435]:
            - heading "Simple, transparent pricing" [level=2] [ref=e436]
            - paragraph [ref=e437]: Because this is a private-pay service, no insurance authorization is required. You choose the visit that fits your schedule. Pricing is straightforward, and our team will explain the cost before the visit so there are no surprises.
        - generic [ref=e438]:
          - heading "Ready to take the next step?" [level=2] [ref=e439]
          - paragraph [ref=e440]: Our team is here to answer questions and help you find the right care or opportunity.
