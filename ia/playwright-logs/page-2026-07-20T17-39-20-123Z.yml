            - heading "Medical social work" [level=3] [ref=f9e107]
            - paragraph [ref=f9e108]: Our social workers connect families to community resources, entitlements, counseling, and the emotional support needed during complex care.
            - link "Talk to a social worker" [ref=f9e109] [cursor=pointer]:
              - /url: "#contact"
              - text: Talk to a social worker
