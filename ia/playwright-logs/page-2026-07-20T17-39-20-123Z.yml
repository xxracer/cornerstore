            - heading "Joint Commission accredited" [level=3] [ref=f9e145]
            - paragraph [ref=f9e146]: We meet rigorous national standards for quality and safety in home care, so families can trust the care their loved ones receive.
          - generic [ref=f9e147]:
            - generic [ref=f9e148]: "02"
            - heading "Coastal Bend born and staffed" [level=3] [ref=f9e149]
            - paragraph [ref=f9e150]: Our caregivers live here. They understand the local health network, the rhythm of coastal life, and the value of showing up on time.
          - generic [ref=f9e151]:
            - generic [ref=f9e152]: "03"
            - heading "Care built around family" [level=3] [ref=f9e153]
            - paragraph [ref=f9e154]: We do not just treat a chart. We listen to patients, support caregivers, and communicate clearly with physicians and loved ones.
          - generic [ref=f9e155]:
