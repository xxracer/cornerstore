            - heading "Home health aides" [level=3] [ref=f9e98]
            - paragraph [ref=f9e99]: Trained aides assist with bathing, dressing, grooming, light meal preparation, and daily activities under nurse supervision.
            - link "Meet our aides" [ref=f9e100] [cursor=pointer]:
              - /url: "#contact"
              - text: Meet our aides
              - generic [ref=f9e101]: →
