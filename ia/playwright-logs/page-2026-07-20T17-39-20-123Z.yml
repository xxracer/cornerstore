            - generic [ref=f9e172]: Private-pay services
            - heading "Private-pay nursing visits to set up your MedPlanner" [level=3] [ref=f9e177]
            - paragraph [ref=f9e178]: We now offer affordable private-pay visits for patients and families who need a nurse to organize, set up, and explain a weekly medication planner in the comfort of home.
            - link "Read more" [ref=f9e179] [cursor=pointer]:
              - /url: /articles/private-pay-mediplanner-nursing-visits/
          - article [ref=f9e182]:
            - generic [ref=f9e183]: Skilled nursing
            - heading "What does skilled nursing care include at home?" [level=3] [ref=f9e189]
            - paragraph [ref=f9e190]: Many families wonder what a home health nurse actually does. From wound care and IV therapy to medication management and vitals monitoring, skilled nursing keeps patients safe without leaving home.
            - link "Read more" [ref=f9e191] [cursor=pointer]:
              - /url: /articles/what-does-skilled-nursing-care-include-at-home/
          - article [ref=f9e194]:
            - generic [ref=f9e195]: Memory care
            - heading "How to care for a loved one with Alzheimer's or dementia" [level=3] [ref=f9e206]
            - paragraph [ref=f9e207]: Caring for someone with memory loss can feel overwhelming. Learn how routine, communication, and professional support can help families in Rockport, Portland, and Corpus Christi.
            - link "Read more" [ref=f9e208] [cursor=pointer]:
              - /url: /articles/how-to-care-for-a-loved-one-with-alzheimers-or-dementia/
          - article [ref=f9e211]:
            - generic [ref=f9e212]: Medication safety
            - heading "Medication management for seniors at home" [level=3] [ref=f9e218]
            - paragraph [ref=f9e219]: Missed doses and medication conflicts are common risks for older adults. Discover how home health teams help organize, monitor, and administer medications safely.
            - link "Read more" [ref=f9e220] [cursor=pointer]:
              - /url: /articles/medication-management-for-seniors-at-home/
          - article [ref=f9e223]:
            - generic [ref=f9e224]: Accreditation
            - heading "What Joint Commission accreditation means for your family" [level=3] [ref=f9e230]
            - paragraph [ref=f9e231]: Not every home health agency meets national quality and safety standards. Accreditation means your loved one's care is held to strict, regularly reviewed guidelines.
            - link "Read more" [ref=f9e232] [cursor=pointer]:
              - /url: /articles/what-joint-commission-accreditation-means/
          - article [ref=f9e235]:
            - generic [ref=f9e236]: Family caregivers
            - heading "10 practical tips for family caregivers" [level=3] [ref=f9e244]
            - paragraph [ref=f9e245]: Balancing work, family, and caregiving is exhausting. These tips can help caregivers protect their own health while supporting a parent, spouse, or aging relative.
            - link "Read more" [ref=f9e246] [cursor=pointer]:
              - /url: /articles/ten-practical-tips-for-family-caregivers/
          - article [ref=f9e249]:
            - generic [ref=f9e250]: Recovery
            - heading "Recovering from surgery at home with therapy support" [level=3] [ref=f9e256]
            - paragraph [ref=f9e257]: Physical and occupational therapy at home helps patients rebuild strength, balance, and confidence after surgery, reducing the risk of falls and readmissions.
            - link "Read more" [ref=f9e258] [cursor=pointer]:
              - /url: /articles/recovering-from-surgery-at-home-with-therapy-support/
          - article [ref=f9e261]:
            - generic [ref=f9e262]: Careers
            - heading "Join the Cornerstone Home Health team" [level=3] [ref=f9e268]
            - paragraph [ref=f9e269]: We are hiring a full-time LVN, PRN LVN/RN, PRN PT/PTA, and PRN Home Health Aide across the Coastal Bend. Find a role that fits your skills and schedule.
            - link "Read more" [ref=f9e270] [cursor=pointer]:
              - /url: /articles/join-the-cornerstone-team/
