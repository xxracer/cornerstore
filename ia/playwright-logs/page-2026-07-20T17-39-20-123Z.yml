        - generic [ref=f9e61]:
          - paragraph [ref=f9e62]: What we do
          - heading "Complete care, right at your doorstep." [level=2] [ref=f9e63]
          - paragraph [ref=f9e64]: Every plan begins with a conversation. From skilled nursing to personal daily support, we build care around the patient and the people who love them.
        - generic [ref=f9e65]:
          - article [ref=f9e66]:
            - heading "Skilled nursing" [level=3] [ref=f9e72]
            - paragraph [ref=f9e73]: Registered nurses and licensed vocational nurses provide wound care, IV therapy, injections, tube feedings, medication management, and close monitoring of changing conditions.
            - link "Ask about nursing care" [ref=f9e74] [cursor=pointer]:
              - /url: "#contact"
              - text: Ask about nursing care
              - generic [ref=f9e75]: →
          - article [ref=f9e76]:
            - heading "Physical, occupational & speech therapy" [level=3] [ref=f9e81]
            - paragraph [ref=f9e82]: Rehabilitation at home helps patients rebuild strength, balance, mobility, and communication after surgery, illness, or injury.
            - link "Learn about therapy" [ref=f9e83] [cursor=pointer]:
              - /url: "#contact"
              - text: Learn about therapy
              - generic [ref=f9e84]: →
          - article [ref=f9e85]:
            - heading "Dementia & Alzheimer's care" [level=3] [ref=f9e90]
            - paragraph [ref=f9e91]: Specialized support for memory-related conditions, focusing on safety, routine, communication, and family education through every stage.
            - link "Explore memory care" [ref=f9e92] [cursor=pointer]:
              - /url: "#contact"
              - text: Explore memory care
              - generic [ref=f9e93]: →
