            - heading "What does skilled nursing care include at home?" [level=3] [ref=e190]
            - paragraph [ref=e191]: Many families wonder what a home health nurse actually does. From wound care and IV therapy to medication management and vitals monitoring, skilled nursing keeps patients safe without leaving home.
