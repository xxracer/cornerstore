          - generic [ref=f4e53]:
            - heading "What we are looking for" [level=2] [ref=f4e54]
            - paragraph [ref=f4e55]: We value compassion, reliability, and clinical skill. Ideal candidates hold current Texas licensure or certification in their field, have a valid driver's license, and are comfortable working independently in patients' homes. Home health experience is preferred, but new graduates with the right attitude are encouraged to apply.
          - generic [ref=f4e56]:
            - heading "How to apply" [level=2] [ref=f4e57]
            - paragraph [ref=f4e58]: Call our office or send a message through our contact form. Let us know which position interests you and the best time to reach you. We look forward to learning more about you.
