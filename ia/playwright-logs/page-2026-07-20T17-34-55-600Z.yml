      - paragraph [ref=f4e34]: We are hiring a full-time LVN, PRN LVN/RN, PRN PT/PTA, and PRN Home Health Aide across the Coastal Bend. Find a role that fits your skills and schedule.
    - article [ref=f4e35]:
      - generic [ref=f4e36]:
        - generic [ref=f4e37]:
          - generic [ref=f4e38]:
            - heading "Why work with us" [level=2] [ref=f4e39]
            - paragraph [ref=f4e40]: Cornerstone Home Health is locally owned, Joint Commission accredited, and rooted in the Coastal Bend communities we serve. Our clinicians live here, work here, and take pride in building real relationships with patients and families.
            - paragraph [ref=f4e41]: We offer flexible scheduling, a supportive clinical team, and the chance to make a direct difference in your neighbors' lives.
