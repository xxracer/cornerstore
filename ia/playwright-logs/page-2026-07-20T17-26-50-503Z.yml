            - paragraph [ref=e221]: Not every home health agency meets national quality and safety standards. Accreditation means your loved one's care is held to strict, regularly reviewed guidelines.
            - link "Read more" [ref=e222] [cursor=pointer]:
              - /url: /articles/what-joint-commission-accreditation-means/
