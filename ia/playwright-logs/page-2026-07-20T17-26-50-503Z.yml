            - paragraph [ref=e168]: We now offer affordable private-pay visits for patients and families who need a nurse to organize, set up, and explain a weekly medication planner in the comfort of home.
            - link "Read more" [ref=e169] [cursor=pointer]:
              - /url: /articles/private-pay-mediplanner-nursing-visits/
          - article [ref=e172]:
            - generic [ref=e173]: Skilled nursing
            - heading "What does skilled nursing care include at home?" [level=3] [ref=e179]
            - paragraph [ref=e180]: Many families wonder what a home health nurse actually does. From wound care and IV therapy to medication management and vitals monitoring, skilled nursing keeps patients safe without leaving home.
            - link "Read more" [ref=e181] [cursor=pointer]:
              - /url: /articles/what-does-skilled-nursing-care-include-at-home/
          - article [ref=e184]:
