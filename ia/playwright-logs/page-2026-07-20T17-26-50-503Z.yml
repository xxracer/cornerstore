            - heading "How to care for a loved one with Alzheimer's or dementia" [level=3] [ref=e196]
            - paragraph [ref=e197]: Caring for someone with memory loss can feel overwhelming. Learn how routine, communication, and professional support can help families in Rockport, Portland, and Corpus Christi.
            - link "Read more" [ref=e198] [cursor=pointer]:
              - /url: /articles/how-to-care-for-a-loved-one-with-alzheimers-or-dementia/
          - article [ref=e201]:
