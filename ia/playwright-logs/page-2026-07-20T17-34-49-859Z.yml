      - heading "Home health services across the Coastal Bend." [level=1] [ref=f2e127]
    - generic [ref=f2e130]:
      - generic [ref=f2e131]:
        - heading "Skilled nursing" [level=2] [ref=f2e137]
        - paragraph [ref=f2e138]: Registered nurses and licensed vocational nurses provide wound care, IV therapy, injections, tube feedings, medication management, and close monitoring of changing conditions.
      - generic [ref=f2e139]:
        - heading "Physical, occupational & speech therapy" [level=2] [ref=f2e144]
        - paragraph [ref=f2e145]: Rehabilitation at home helps patients rebuild strength, balance, mobility, and communication after surgery, illness, or injury.
      - generic [ref=f2e146]:
        - heading "Dementia & Alzheimer's care" [level=2] [ref=f2e151]
        - paragraph [ref=f2e152]: Specialized support for memory-related conditions, focusing on safety, routine, communication, and family education through every stage.
      - generic [ref=f2e153]:
        - heading "Home health aides" [level=2] [ref=f2e157]
        - paragraph [ref=f2e158]: Trained aides assist with bathing, dressing, grooming, light meal preparation, and daily activities under nurse supervision.
      - generic [ref=f2e159]:
        - heading "Medical social work" [level=2] [ref=f2e164]
        - paragraph [ref=f2e165]: Our social workers connect families to community resources, entitlements, counseling, and the emotional support needed during complex care.
