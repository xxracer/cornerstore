    - generic [ref=f2e35]:
      - article [ref=f2e36]:
        - generic [ref=f2e37]: Private-pay services
        - heading "Private-pay nursing visits to set up your MedPlanner" [level=2] [ref=f2e42]
        - paragraph [ref=f2e43]: We now offer affordable private-pay visits for patients and families who need a nurse to organize, set up, and explain a weekly medication planner in the comfort of home.
        - link "Read more" [ref=f2e44] [cursor=pointer]:
          - /url: /articles/private-pay-mediplanner-nursing-visits/
      - article [ref=f2e47]:
        - generic [ref=f2e48]: Skilled nursing
        - heading "What does skilled nursing care include at home?" [level=2] [ref=f2e54]
        - paragraph [ref=f2e55]: Many families wonder what a home health nurse actually does. From wound care and IV therapy to medication management and vitals monitoring, skilled nursing keeps patients safe without leaving home.
        - link "Read more" [ref=f2e56] [cursor=pointer]:
          - /url: /articles/what-does-skilled-nursing-care-include-at-home/
      - article [ref=f2e59]:
        - generic [ref=f2e60]: Memory care
        - heading "How to care for a loved one with Alzheimer's or dementia" [level=2] [ref=f2e71]
        - paragraph [ref=f2e72]: Caring for someone with memory loss can feel overwhelming. Learn how routine, communication, and professional support can help families in Rockport, Portland, and Corpus Christi.
        - link "Read more" [ref=f2e73] [cursor=pointer]:
          - /url: /articles/how-to-care-for-a-loved-one-with-alzheimers-or-dementia/
      - article [ref=f2e76]:
        - generic [ref=f2e77]: Medication safety
        - heading "Medication management for seniors at home" [level=2] [ref=f2e83]
        - paragraph [ref=f2e84]: Missed doses and medication conflicts are common risks for older adults. Discover how home health teams help organize, monitor, and administer medications safely.
        - link "Read more" [ref=f2e85] [cursor=pointer]:
          - /url: /articles/medication-management-for-seniors-at-home/
      - article [ref=f2e88]:
        - generic [ref=f2e89]: Accreditation
        - heading "What Joint Commission accreditation means for your family" [level=2] [ref=f2e95]
        - paragraph [ref=f2e96]: Not every home health agency meets national quality and safety standards. Accreditation means your loved one's care is held to strict, regularly reviewed guidelines.
        - link "Read more" [ref=f2e97] [cursor=pointer]:
          - /url: /articles/what-joint-commission-accreditation-means/
      - article [ref=f2e100]:
        - generic [ref=f2e101]: Family caregivers
        - heading "10 practical tips for family caregivers" [level=2] [ref=f2e109]
        - paragraph [ref=f2e110]: Balancing work, family, and caregiving is exhausting. These tips can help caregivers protect their own health while supporting a parent, spouse, or aging relative.
        - link "Read more" [ref=f2e111] [cursor=pointer]:
          - /url: /articles/ten-practical-tips-for-family-caregivers/
      - article [ref=f2e114]:
        - generic [ref=f2e115]: Recovery
        - heading "Recovering from surgery at home with therapy support" [level=2] [ref=f2e121]
        - paragraph [ref=f2e122]: Physical and occupational therapy at home helps patients rebuild strength, balance, and confidence after surgery, reducing the risk of falls and readmissions.
        - link "Read more" [ref=f2e123] [cursor=pointer]:
          - /url: /articles/recovering-from-surgery-at-home-with-therapy-support/
