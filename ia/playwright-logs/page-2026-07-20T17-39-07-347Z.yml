          - heading "Local care. National standards. Personal attention." [level=2] [ref=f7e141]
        - generic [ref=f7e142]:
          - generic [ref=f7e143]:
            - generic [ref=f7e144]: "01"
            - heading "Joint Commission accredited" [level=3] [ref=f7e145]
            - paragraph [ref=f7e146]: We meet rigorous national standards for quality and safety in home care, so families can trust the care their loved ones receive.
          - generic [ref=f7e147]:
            - generic [ref=f7e148]: "02"
            - heading "Coastal Bend born and staffed" [level=3] [ref=f7e149]
            - paragraph [ref=f7e150]: Our caregivers live here. They understand the local health network, the rhythm of coastal life, and the value of showing up on time.
          - generic [ref=f7e151]:
            - generic [ref=f7e152]: "03"
            - heading "Care built around family" [level=3] [ref=f7e153]
            - paragraph [ref=f7e154]: We do not just treat a chart. We listen to patients, support caregivers, and communicate clearly with physicians and loved ones.
          - generic [ref=f7e155]:
            - generic [ref=f7e156]: "04"
            - heading "Available when you need us" [level=3] [ref=f7e157]
            - paragraph [ref=f7e158]: Home health needs do not follow office hours. Our team is reachable around the clock for questions, concerns, and urgent changes.
