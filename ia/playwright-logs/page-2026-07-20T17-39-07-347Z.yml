        - generic [ref=f7e61]:
          - paragraph [ref=f7e62]: What we do
          - heading "Complete care, right at your doorstep." [level=2] [ref=f7e63]
          - paragraph [ref=f7e64]: Every plan begins with a conversation. From skilled nursing to personal daily support, we build care around the patient and the people who love them.
        - generic [ref=f7e65]:
          - article [ref=f7e66]:
            - heading "Skilled nursing" [level=3] [ref=f7e72]
            - paragraph [ref=f7e73]: Registered nurses and licensed vocational nurses provide wound care, IV therapy, injections, tube feedings, medication management, and close monitoring of changing conditions.
            - link "Ask about nursing care" [ref=f7e74] [cursor=pointer]:
              - /url: "#contact"
              - text: Ask about nursing care
              - generic [ref=f7e75]: →
          - article [ref=f7e76]:
            - heading "Physical, occupational & speech therapy" [level=3] [ref=f7e81]
            - paragraph [ref=f7e82]: Rehabilitation at home helps patients rebuild strength, balance, mobility, and communication after surgery, illness, or injury.
            - link "Learn about therapy" [ref=f7e83] [cursor=pointer]:
              - /url: "#contact"
              - text: Learn about therapy
              - generic [ref=f7e84]: →
          - article [ref=f7e85]:
            - heading "Dementia & Alzheimer's care" [level=3] [ref=f7e90]
            - paragraph [ref=f7e91]: Specialized support for memory-related conditions, focusing on safety, routine, communication, and family education through every stage.
            - link "Explore memory care" [ref=f7e92] [cursor=pointer]:
              - /url: "#contact"
              - text: Explore memory care
              - generic [ref=f7e93]: →
          - article [ref=f7e94]:
            - heading "Home health aides" [level=3] [ref=f7e98]
            - paragraph [ref=f7e99]: Trained aides assist with bathing, dressing, grooming, light meal preparation, and daily activities under nurse supervision.
            - link "Meet our aides" [ref=f7e100] [cursor=pointer]:
              - /url: "#contact"
              - text: Meet our aides
              - generic [ref=f7e101]: →
          - article [ref=f7e102]:
            - heading "Medical social work" [level=3] [ref=f7e107]
            - paragraph [ref=f7e108]: Our social workers connect families to community resources, entitlements, counseling, and the emotional support needed during complex care.
            - link "Talk to a social worker" [ref=f7e109] [cursor=pointer]:
              - /url: "#contact"
              - text: Talk to a social worker
              - generic [ref=f7e110]: →
          - article [ref=f7e111]:
            - heading "Not sure what you need?" [level=3] [ref=f7e114]
            - paragraph [ref=f7e115]: Tell us what is happening. We will help you understand your options, coordinate with your physician, and build a plan that fits.
            - link "Start a conversation" [ref=f7e116] [cursor=pointer]:
              - /url: "#contact"
