            - heading "Home health aides" [level=3] [ref=f5e98]
            - paragraph [ref=f5e99]: Trained aides assist with bathing, dressing, grooming, light meal preparation, and daily activities under nurse supervision.
            - link "Meet our aides" [ref=f5e100] [cursor=pointer]:
              - /url: "#contact"
              - text: Meet our aides
