            - heading "Medical social work" [level=3] [ref=f5e107]
            - paragraph [ref=f5e108]: Our social workers connect families to community resources, entitlements, counseling, and the emotional support needed during complex care.
            - link "Talk to a social worker" [ref=f5e109] [cursor=pointer]:
