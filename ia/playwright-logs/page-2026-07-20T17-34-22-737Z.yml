    - generic [ref=f1e34]:
      - article [ref=f1e35]:
        - generic [ref=f1e36]: Private-pay services
        - heading "Private-pay nursing visits to set up your MedPlanner" [level=2] [ref=f1e41]
        - paragraph [ref=f1e42]: We now offer affordable private-pay visits for patients and families who need a nurse to organize, set up, and explain a weekly medication planner in the comfort of home.
        - link "Read more" [ref=f1e43] [cursor=pointer]:
          - /url: /articles/private-pay-mediplanner-nursing-visits/
      - article [ref=f1e46]:
        - generic [ref=f1e47]: Skilled nursing
        - heading "What does skilled nursing care include at home?" [level=2] [ref=f1e53]
        - paragraph [ref=f1e54]: Many families wonder what a home health nurse actually does. From wound care and IV therapy to medication management and vitals monitoring, skilled nursing keeps patients safe without leaving home.
        - link "Read more" [ref=f1e55] [cursor=pointer]:
          - /url: /articles/what-does-skilled-nursing-care-include-at-home/
      - article [ref=f1e58]:
        - generic [ref=f1e59]: Memory care
        - heading "How to care for a loved one with Alzheimer's or dementia" [level=2] [ref=f1e70]
        - paragraph [ref=f1e71]: Caring for someone with memory loss can feel overwhelming. Learn how routine, communication, and professional support can help families in Rockport, Portland, and Corpus Christi.
        - link "Read more" [ref=f1e72] [cursor=pointer]:
          - /url: /articles/how-to-care-for-a-loved-one-with-alzheimers-or-dementia/
      - article [ref=f1e75]:
        - generic [ref=f1e76]: Medication safety
        - heading "Medication management for seniors at home" [level=2] [ref=f1e82]
        - paragraph [ref=f1e83]: Missed doses and medication conflicts are common risks for older adults. Discover how home health teams help organize, monitor, and administer medications safely.
        - link "Read more" [ref=f1e84] [cursor=pointer]:
          - /url: /articles/medication-management-for-seniors-at-home/
      - article [ref=f1e87]:
        - generic [ref=f1e88]: Accreditation
        - heading "What Joint Commission accreditation means for your family" [level=2] [ref=f1e94]
        - paragraph [ref=f1e95]: Not every home health agency meets national quality and safety standards. Accreditation means your loved one's care is held to strict, regularly reviewed guidelines.
        - link "Read more" [ref=f1e96] [cursor=pointer]:
          - /url: /articles/what-joint-commission-accreditation-means/
      - article [ref=f1e99]:
        - generic [ref=f1e100]: Family caregivers
        - heading "10 practical tips for family caregivers" [level=2] [ref=f1e108]
        - paragraph [ref=f1e109]: Balancing work, family, and caregiving is exhausting. These tips can help caregivers protect their own health while supporting a parent, spouse, or aging relative.
        - link "Read more" [ref=f1e110] [cursor=pointer]:
          - /url: /articles/ten-practical-tips-for-family-caregivers/
      - article [ref=f1e113]:
        - generic [ref=f1e114]: Recovery
        - heading "Recovering from surgery at home with therapy support" [level=2] [ref=f1e120]
        - paragraph [ref=f1e121]: Physical and occupational therapy at home helps patients rebuild strength, balance, and confidence after surgery, reducing the risk of falls and readmissions.
        - link "Read more" [ref=f1e122] [cursor=pointer]:
          - /url: /articles/recovering-from-surgery-at-home-with-therapy-support/
      - article [ref=f1e125]:
        - generic [ref=f1e126]: Careers
        - heading "Join the Cornerstone Home Health team" [level=2] [ref=f1e132]
        - paragraph [ref=f1e133]: We are hiring a full-time LVN, PRN LVN/RN, PRN PT/PTA, and PRN Home Health Aide across the Coastal Bend. Find a role that fits your skills and schedule.
        - link "Read more" [ref=f1e134] [cursor=pointer]:
